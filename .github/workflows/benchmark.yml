name: Cardano script benchmark

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: Benchmark scope
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - clusters
          - full
      workers:
        description: Concurrent script processes (PR checks always use one)
        type: choice
        required: true
        default: '1'
        options:
          - '1'
          - '2'
          - '4'
      limit:
        description: Diagnostic case limit; 0 runs the whole selected tier
        type: number
        required: true
        default: 0

permissions:
  contents: read

concurrency:
  group: cardano-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: benchmark
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Check frozen smoke cohort
        run: python3 scripts/make_smoke_cohort.py --check

      - name: Restore shared package builds
        uses: actions/cache@v4
        with:
          path: |
            packages/Lean-blaster/.lake/build
            packages/PlutusCoreBlaster/.lake/build
            packages/CardanoLedgerApiBlaster/.lake/build
          key: cardano-shared-build-${{ runner.os }}-${{ hashFiles('benchmark/lean-toolchain', 'benchmark/lake-manifest.json', 'packages/**/*.lean', 'packages/**/lakefile.lean') }}
          restore-keys: cardano-shared-build-${{ runner.os }}-

      - name: Install pinned Z3
        run: |
          mkdir -p .tools
          curl -fL --retry 3 --silent --show-error -o .tools/z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-5.4.1/z3-5.4.1-x64-glibc-2.39.zip
          echo 'b548bac48ef2452b4e09ea2945cf4b011d5f43fcf39e4799df268ee7e0769d85  .tools/z3.zip' | sha256sum -c -
          unzip -q .tools/z3.zip -d .tools
          .tools/z3-5.4.1-x64-glibc-2.39/bin/z3 -version
          z3_root="$GITHUB_WORKSPACE/.tools/z3-5.4.1-x64-glibc-2.39"
          test -f "$z3_root/bin/libz3.a"
          test -f "$z3_root/include/z3.h"
          echo "Z3_LIB_PATH=$z3_root/bin" >> "$GITHUB_ENV"
          echo "Z3_INC_PATH=$z3_root/include" >> "$GITHUB_ENV"

      - name: Build shared Lean dependencies
        working-directory: benchmark
        run: lake build CardanoLedgerApi

      - name: Reuse cluster results for full run
        if: github.event_name == 'workflow_dispatch' && inputs.tier == 'full'
        uses: actions/cache/restore@v4
        with:
          path: benchmark/LiveScripts/results/latest.json
          key: cardano-clusters-${{ runner.os }}-${{ github.sha }}-${{ inputs.workers }}w-25s-z3-5.4.1

      - name: Run selected tier
        env:
          BENCH_TIER: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.tier }}
          BENCH_WORKERS: ${{ github.event_name == 'pull_request' && '1' || inputs.workers }}
          BENCH_LIMIT: ${{ github.event_name == 'pull_request' && '0' || inputs.limit }}
        run: |
          args=(--z3 "$GITHUB_WORKSPACE/.tools/z3-5.4.1-x64-glibc-2.39/bin/z3"
                --workers "$BENCH_WORKERS" --timeout 25)
          if [[ "$BENCH_LIMIT" -gt 0 ]]; then
            args+=(--limit "$BENCH_LIMIT")
          fi
          python3 scripts/bench.py "$BENCH_TIER" "${args[@]}"

      - name: Save cluster results for full run
        if: github.event_name == 'workflow_dispatch' && inputs.tier == 'clusters' && inputs.limit == 0
        uses: actions/cache/save@v4
        with:
          path: benchmark/LiveScripts/results/latest.json
          key: cardano-clusters-${{ runner.os }}-${{ github.sha }}-${{ inputs.workers }}w-25s-z3-5.4.1

      - name: Summarize results
        if: always()
        env:
          BENCH_TIER: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.tier }}
        run: python3 scripts/summary.py "$BENCH_TIER" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardano-benchmark-${{ github.run_id }}
          path: |
            benchmark/LiveScripts/results/*.jsonl
            benchmark/LiveScripts/results/latest.json
            benchmark/LiveScripts/results/active-config.json
          if-no-files-found: warn
