name: Cardano script benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/benchmark.yml'
      - 'packages/**'
      - 'benchmark/**'
      - '!benchmark/cardano-dashboard/**'
      - '!benchmark/LiveScripts/results/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      tier:
        description: Benchmark scope
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - clusters
          - full
      workers:
        description: Concurrent script processes per runner (PR checks always use one)
        type: choice
        required: true
        default: '1'
        options:
          - '1'
          - '2'
          - '4'
      limit:
        description: Diagnostic case limit; 0 runs the whole selected tier
        type: number
        required: true
        default: 0

permissions:
  contents: read

concurrency:
  group: cardano-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search_plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          BENCH_TIER: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.tier }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          count = 16 if os.environ["BENCH_TIER"] == "full" else 1
          print("matrix=" + json.dumps({"include": [
              {"index": index, "count": count} for index in range(count)
          ]}, separators=(",", ":")))
          PY

  benchmark:
    needs: search_plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.search_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check search sharding
        if: matrix.index == 0
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: benchmark
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Check frozen smoke cohort
        run: python3 scripts/make_smoke_cohort.py --check

      - name: Restore shared package builds
        id: shared-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/Lean-blaster/.lake/build
            packages/PlutusCoreBlaster/.lake/build
            packages/CardanoLedgerApiBlaster/.lake/build
          key: cardano-shared-build-${{ runner.os }}-${{ hashFiles('benchmark/lean-toolchain', 'benchmark/lake-manifest.json', 'packages/**/*.lean', 'packages/**/lakefile.lean') }}
          restore-keys: cardano-shared-build-${{ runner.os }}-

      - name: Install pinned Z3
        run: |
          mkdir -p .tools
          curl -fL --retry 3 --silent --show-error -o .tools/z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-5.4.1/z3-5.4.1-x64-glibc-2.39.zip
          echo 'b548bac48ef2452b4e09ea2945cf4b011d5f43fcf39e4799df268ee7e0769d85  .tools/z3.zip' | sha256sum -c -
          unzip -q .tools/z3.zip -d .tools
          .tools/z3-5.4.1-x64-glibc-2.39/bin/z3 -version
          z3_root="$GITHUB_WORKSPACE/.tools/z3-5.4.1-x64-glibc-2.39"
          test -f "$z3_root/bin/libz3.a"
          test -f "$z3_root/include/z3.h"
          echo "Z3_LIB_PATH=$z3_root/bin" >> "$GITHUB_ENV"
          echo "Z3_INC_PATH=$z3_root/include" >> "$GITHUB_ENV"

      - name: Build shared Lean dependencies
        working-directory: benchmark
        run: lake build CardanoLedgerApi

      - name: Check imported Z3 shim PIC
        run: |
          for unit in context solver sorts terms datatypes; do
            trace="packages/Lean-blaster/.lake/build/ffi/z3_shim_${unit}.o.trace"
            if ! grep -Fq -- ' -fPIC' "$trace"; then
              echo "Z3 shim object was not compiled with -fPIC: $trace" >&2
              exit 1
            fi
          done
          if readelf -rW packages/Lean-blaster/.lake/build/ffi/z3_shim_*.o | grep -Eq 'R_X86_64_(32|32S)[[:space:]]'; then
            echo 'An imported Z3 shim object contains a non-PIC x86_64 relocation' >&2
            exit 1
          fi

      - name: Save successful shared package build
        if: matrix.index == 0 && steps.shared-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            packages/Lean-blaster/.lake/build
            packages/PlutusCoreBlaster/.lake/build
            packages/CardanoLedgerApiBlaster/.lake/build
          key: cardano-shared-build-${{ runner.os }}-${{ hashFiles('benchmark/lean-toolchain', 'benchmark/lake-manifest.json', 'packages/**/*.lean', 'packages/**/lakefile.lean') }}

      - name: Verify concrete replay witnesses
        working-directory: benchmark
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            python3 LiveScripts/verify_replays.py --check --changed-from "$BASE_SHA"
          else
            python3 LiveScripts/verify_replays.py --check
          fi

      - name: Run selected tier
        env:
          BENCH_TIER: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.tier }}
          BENCH_WORKERS: ${{ github.event_name == 'pull_request' && '1' || inputs.workers }}
          BENCH_LIMIT: ${{ github.event_name == 'pull_request' && '0' || inputs.limit }}
        run: |
          args=(--z3 "$GITHUB_WORKSPACE/.tools/z3-5.4.1-x64-glibc-2.39/bin/z3"
                --workers "$BENCH_WORKERS" --timeout 60 --smt-timeout 20
                --shard-index "${{ matrix.index }}" --shard-count "${{ matrix.count }}"
                --result-path-file "$RUNNER_TEMP/cardano-result-path")
          if [[ "$BENCH_LIMIT" -gt 0 ]]; then
            args+=(--limit "$BENCH_LIMIT")
          fi
          python3 scripts/bench.py "$BENCH_TIER" "${args[@]}"

      - name: Replay new counterexamples
        if: matrix.count == 1
        working-directory: benchmark
        env:
          REPLAY_LIMIT: ${{ github.event_name == 'pull_request' && '0' || '12' }}
        run: |
          python3 LiveScripts/replay_run.py \
            --results-file "$(cat "$RUNNER_TEMP/cardano-result-path")" --limit "$REPLAY_LIMIT" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Summarize results
        if: always() && matrix.count == 1
        env:
          BENCH_TIER: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.tier }}
        run: python3 scripts/summary.py "$BENCH_TIER" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.count == 1 && format('cardano-benchmark-{0}', github.run_id) || format('cardano-benchmark-shard-{0}-{1}', github.run_id, matrix.index) }}
          path: |
            benchmark/LiveScripts/results/*.jsonl
            benchmark/LiveScripts/results/latest.json
            benchmark/LiveScripts/results/active-config.json
            benchmark/LiveScripts/results/verified.json
            benchmark/LiveScripts/results/replay-summary.json
            benchmark/LiveScripts/results/replay-evidence.json
          if-no-files-found: warn

  combine_full:
    needs: benchmark
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'full' && needs.benchmark.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cardano-benchmark-shard-${{ github.run_id }}-*
          path: ${{ runner.temp }}/search-shards
      - name: Validate and combine the complete search
        env:
          BENCH_LIMIT: ${{ inputs.limit }}
        run: |
          python3 scripts/combine_search_shards.py \
            --shards-dir "$RUNNER_TEMP/search-shards" \
            --workflow-run-id "${{ github.run_id }}" \
            --revision "${{ github.sha }}" \
            --shard-count 16 --limit "$BENCH_LIMIT" \
            --output "$RUNNER_TEMP/combined-search"
      - name: Summarize full search
        run: |
          cp "$RUNNER_TEMP/combined-search/latest.json" benchmark/LiveScripts/results/latest.json
          cp "$RUNNER_TEMP/combined-search/active-config.json" benchmark/LiveScripts/results/active-config.json
          python3 scripts/summary.py full >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cardano-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/combined-search
          if-no-files-found: error
